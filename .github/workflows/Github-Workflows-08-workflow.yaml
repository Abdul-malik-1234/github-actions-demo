name: Eight Workflow
on:
  workflow_dispatch:
jobs:
  Staging:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14","3.15"]
    steps:
      - name: Fetch Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup dependencies
        run: pip install --target ./venv pytest
      - name: Upload Workspace & Download Artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ matrix.python-version }}
          path: .
          include-hidden-files: true
  Production:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14","3.15"]
    steps:
      - name: Download Dependencies
        uses: actions/download-artifact@v4
        with:
          name: workspace-${{ matrix.python-version }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Add venv to Environment Path
        run: |
          echo "$GITHUB_WORKSPACE/venv/bin" >> $GITHUB_PATH
          echo "$PYTHONPATH=$GITHUB_WORKSPACE/venv" >> $GITHUB_ENV
      - name: Check Pytest version & Run tests
        run: |
          python -m pytest --version
          python -m pytest -v
