name: Working on Artifacts
on:
  workflow_dispatch:
jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - name: Creation of Artifacts
        run: |
          echo "This is a artifact file" > artifact.txt
          echo "This file is created on date: $(date)" >> artifact.txt
      - name: Uploading of Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: first-artifact
          path: artifact.txt
  production:
    runs-on: ubuntu-latest
    needs:
      staging
    steps:
      - name: Downloading Artifacts
        uses: actions/download-artifact@v4
        with:
          name: first-artifact
          path: .
      - name: Print Artifact
        run: |
          echo "Printing the artifact file: artifact.txt"
          cat artifact.txt
          
        
