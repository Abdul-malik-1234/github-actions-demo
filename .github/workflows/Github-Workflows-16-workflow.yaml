name: Creation fo Artifacts
on:
  workflow_dispatch:
jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - name: Creation of artifact
        run: |
          echo "This is first artifact :)" > artifact.txt
          echo "This artifact is created on $(date)" >> artifact.txt
      - name: Uploading Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Artifact-creation
          path: artifact.txt

  production:
    runs-on: ubuntu-latest
    needs:
      staging
    steps:
      - name: Downloading Artifact
        uses: actions/download-artifact@v4
        with:
          name: Artifact-creation
          path: .
      - name: Printing Artifact
        run: |
          echo "Printing Artifact :)"
          cat artifact.txt
