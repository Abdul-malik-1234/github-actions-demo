name: Eight Workflow
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
          matrix:
            python-version: ["3.11","3.12"]
    steps:
      - name: Fetch Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
      - name: Setup dependencies
        run: pip install pytest pytest-html
  test:
    runs-on: ubuntu-latest
    strategy:
          matrix:
            python-version: ["3.11","3.12"]
    steps:
      - name: Check Pytest version
        run: pytest --version
      - name: Run Tests
        run: pytest -v
  
