# This workflow teaches how to test your application on 2 different version
name: Fifth Workflow
on:
  workflow_dispatch:
jobs:
  staging:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14","3.15"]
    steps:
      - name: Fetch Code
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run COde on both the version
        run: python Python-Scripts/test.py
